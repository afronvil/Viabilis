# Valeurs proposées par installer_ubuntu.sh (Entrée pour les accepter pendant l'installation).
# Modifiez-les ici avec un éditeur de texte. Ne mettez JAMAIS de mot de passe ni de clé d'API dans ce fichier :
# le script les demande sans les afficher, puis les garde seulement dans /etc/viabilis/viabilis.env.
DEFAUT_DOMAINE=""                 # par exemple viabilis.mon-etablissement.fr
DEFAUT_COURRIEL=""                # adresse pour le certificat HTTPS (Let's Encrypt)
DEFAUT_ADMIN=""                   # votre compte d'administrateur ou d'administratrice sur Viabilis
DEFAUT_NOTIFICATIONS=""   # reçoit les demandes de compte (plusieurs : séparées par des virgules)
DEFAUT_DOMAINES=""                # vide : étudiants et toute autre personne peuvent demander un compte
DEFAUT_SMTP_HOTE=""               # serveur de mail ; Gmail : smtp.gmail.com (voir INSTALLATION_MAISON.md, 5 ter)
DEFAUT_SMTP_PORT="587"
DEFAUT_SMTP_UTILISATEUR=""
DEFAUT_SMTP_EXPEDITEUR=""         # vide : le même que l'identifiant (Gmail impose de toute façon son adresse)
DEFAUT_MODELE="mistral-small-3-2-24b-instruct-2506"
