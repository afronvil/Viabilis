<style>
/* Mise en page : colonne unique pensée pour le téléphone, qui s'élargit en grille sur tablette ; barre d'onglets en bas côté enseignant. */

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A26; --panel:#1C2433; --ink:#E8ECF3; --muted:#A3AEC0; --line:#33405A; --soft:#232D40;
  --accent:#F0A35E; --blue:#7FB0EA; --green:#6CC79B; --violet:#B79BE3;
  --ok:#6CC79B; --warn:#E8C26A; --ko:#F28B7D; --okbg:#1E3A2E; --warnbg:#3D3420; --kobg:#45221F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A26; --panel:#1C2433; --ink:#E8ECF3; --muted:#A3AEC0; --line:#33405A; --soft:#232D40;
  --accent:#F0A35E; --blue:#7FB0EA; --green:#6CC79B; --violet:#B79BE3;
  --ok:#6CC79B; --warn:#E8C26A; --ko:#F28B7D; --okbg:#1E3A2E; --warnbg:#3D3420; --kobg:#45221F; color-scheme:dark}
*{box-sizing:border-box}

.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}

button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}

button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input[type=text],textarea,select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}

.pill.ok{background:var(--okbg);color:var(--ok)} .pill.warn{background:var(--warnbg);color:var(--warn)} .pill.ko{background:var(--kobg);color:var(--ko)}

.tabs button{flex:1;max-width:200px;border:0;background:transparent;font-size:14px;min-height:48px}

</style>

<div class="wrap" id="app">
  <header class="row" style="justify-content:space-between">
    <div>
      <p class="eyebrow" id="role-label">Chargement…</p>
      <h1 id="titre">Viabilis classe</h1>
    </div>
    <button class="ghost small" id="switch-view" hidden>Voir la vue élève</button>
  </header>
  <main id="view"><div class="card"><p class="muted">Connexion à la classe…</p></div></main>
</div>
<nav class="tabs" id="tabs" hidden aria-label="Navigation enseignant">
  <button data-tab="classe" aria-selected="true">Classe</button>
  <button data-tab="reglages" aria-selected="false">Réglages</button>
  <button data-tab="export" aria-selected="false">Données</button>
</nav>

<script>
/* =====================================================================
   Viabilis classe — prototype pilote.
   Vue élève : déclarer la charge, produire ses idées, utiliser une IA dont
   l'ordre et le mode sont réglés par l'enseignant ; chaque étape est une trace.
   Vue enseignant : estimation de l'état de chaque élève (C, A, D, M),
   ruptures menacées, recommandation (règle de la séquence), réglages, export.
   Données : db de l'artefact. config/classe (enseignant), notes/classe
   (enseignant, privé), traces/<id élève> (chaque élève écrit le sien,
   seul l'enseignant lit tout).
   ===================================================================== */
const DEFAUT = {
  seance: 0, ouverte: false, tache: "",
  ordre: "adaptatif",          // "reflexion" | "ia" | "adaptatif"
  mode: "questionner",         // "questionner" | "elements"
  minIdees: 3,
  seuilCharge: 0.7, retraitAgentivite: 0.8, seuilMaitrise: 0.5,
  eleves: {}                   // id -> {ordre?, mode?, retrait?: bool}
};
const S = { db:null, user:null, sample:null, downloads:null, uid:null, admin:false, vue:null,
  config:{...DEFAUT}, traces:{}, notes:{}, monDoc:null, onglet:"classe", detail:null };

const $ = (s, r=document) => r.querySelector(s);
const el = (tag, attrs={}, ...kids) => { const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v === true) e.setAttribute(k, ""); else if (v !== false && v != null) e.setAttribute(k, v); }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e; };
const fr = (v, n=2) => (v == null || isNaN(v)) ? "–" : v.toFixed(n).replace(".", ",");
const now = () => new Date().toISOString();

/* ---------------------------------------------------------------- texte : similarité */
const VIDES = new Set("les des une un le la de du et a au aux en pour par sur avec dans ce ces cet cette son sa ses leur leurs qui que quoi ne pas plus est sont etre faire on il elle ils elles nous vous je tu me te se mon ma mes ton ta tes y d l qu c s n j m t peut peuvent tres comme ou mais donc car si aussi bien tout tous toute toutes".split(" "));
function mots(t){ return new Set(String(t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]+/g," ").split(/\s+/)
  .filter(w => w.length >= 3 && !VIDES.has(w)).map(w => w.replace(/(s|x)$/,""))); }
function jaccard(a, b){ const A = a instanceof Set ? a : mots(a), B = b instanceof Set ? b : mots(b); if (!A.size || !B.size) return 0;
  let n = 0; for (const w of A) if (B.has(w)) n++; return n / (A.size + B.size - n); }
function distinctes(textes){ const reps = []; for (const t of textes){ const m = mots(t); if (!m.size) continue; if (!reps.some(r => jaccard(r, m) >= 0.5)) reps.push(m); } return reps.length; }

/* ---------------------------------------------------------------- estimation de l'état */
const echelle = x => x == null ? null : 0.1 + 0.2 * (x - 1);           // 1..5 -> 0,1..0,9
function moy(xs){ const v = xs.filter(x => x != null && !isNaN(x)); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; }
function brut(s, autres, noteEns){
  const avant = (s.ideesAvant||[]).map(i => i.texte), apres = (s.ideesApres||[]).map(i => i.texte), toutes = avant.concat(apres);
  const phrasesIA = (s.echanges||[]).filter(e => e.role === "ia").flatMap(e => e.texte.split(/[.?!\n]+/)).filter(p => mots(p).size >= 2).map(mots);
  const reprises = apres.filter(t => phrasesIA.some(p => jaccard(t, p) >= 0.4)).length;
  const reprise = apres.length ? reprises / apres.length : 0;
  const autresIdees = autres.map(mots);
  const originales = toutes.filter(t => !autresIdees.some(o => jaccard(t, o) >= 0.5)).length;
  const originalite = toutes.length ? originales / toutes.length : null;
  const nDist = distinctes(toutes);
  const autonomie = Math.min(1, (s.ideesAvantAide ?? avant.length) / 3);
  let C = moy([echelle(s.chargeDebut), echelle(s.chargeFin)]); if (C != null && s.bloque) C = Math.min(1, C + 0.1);
  const A = toutes.length || s.premiereDemande != null ? 0.5 * (1 - reprise) + 0.5 * autonomie : null;
  const D = toutes.length ? 0.4 * Math.min(1, nDist / 5) + 0.3 * (originalite ?? 0) + 0.3 * (1 - reprise) : null;
  const M = moy([echelle(s.compris), noteEns == null ? null : noteEns / 4]);
  return {C, A, D, M, reprise, originalite, nDist, nAvant: avant.length, nApres: apres.length};
}
function etatEleve(uid){
  const doc = S.traces[uid]; if (!doc) return null;
  const nums = Object.keys(doc.seances || {}).map(Number).sort((a,b)=>a-b);
  let etat = {C:null, A:null, D:null, M:null}, dernier = null;
  for (const n of nums){
    const s = doc.seances[n];
    const autres = Object.entries(S.traces).filter(([u]) => u !== uid).flatMap(([,d]) => { const x = d.seances?.[n]; return x ? [...(x.ideesAvant||[]), ...(x.ideesApres||[])].map(i => i.texte) : []; });
    const b = brut(s, autres, S.notes[uid]?.[n]);
    for (const k of ["C","A","D","M"]) if (b[k] != null) etat[k] = etat[k] == null ? b[k] : 0.4 * etat[k] + 0.6 * b[k];   // lissage entre séances
    dernier = {n, ...b};
  }
  return {etat, dernier, nums};
}
function ruptures(e, cfg){
  const r = [];
  const t = (v, cond, nom, proche) => { if (v == null) return; if (cond(v, 0)) r.push({nom, niv:"ko"}); else if (cond(v, proche)) r.push({nom, niv:"warn"}); };
  t(e.C, (v,m) => v > 0.85 - m, "surcharge", 0.1);
  t(e.C, (v,m) => v < 0.2 + m, "ennui", 0.1);
  t(e.A, (v,m) => v < 0.3 + m, "dépendance", 0.1);
  t(e.D, (v,m) => v < 0.25 + m, "rigidité", 0.1);
  t(e.M, (v,m) => v < cfg.seuilMaitrise + m, "maîtrise insuffisante", 0.1);
  return r;
}
function recommandation(e, cfg){
  if (e.C == null) return {ordre:null, mode:null, retrait:false, texte:"Pas encore de trace : suivre la règle de la classe."};
  if (e.C >= cfg.seuilCharge) return {ordre:"ia", mode:"elements", retrait:false, texte:"Charge élevée : l'aide vient d'abord, avec des éléments de réponse."};
  if (e.A != null && e.A >= cfg.retraitAgentivite) return {ordre:"reflexion", mode:"questionner", retrait:true, texte: e.C < 0.3 ? "Autonome et peu chargé : retirer l'IA et relever l'exigence de la tâche." : "Autonome : retirer l'IA."};
  if (e.D != null && e.D < 0.35) return {ordre:"reflexion", mode:"questionner", retrait:false, texte:"Pensée divergente basse : réflexion d'abord, puis une IA qui questionne."};
  return {ordre:"reflexion", mode:"questionner", retrait:false, texte:"Réflexion d'abord, puis une IA qui questionne."};
}
const NOM_ORDRE = {reflexion:"Réflexion d'abord", ia:"IA d'abord", adaptatif:"Adaptatif (selon la charge déclarée)"};
const NOM_MODE = {questionner:"IA qui questionne", elements:"IA qui donne des éléments"};

/* ---------------------------------------------------------------- démarrage */
async function demarrer(){
  try { S.user = await claude.use("user"); } catch { S.user = null; }
  try { S.db = await claude.use("db"); } catch { S.db = null; }
  S.uid = S.user ? await S.user.id() : null;
  S.admin = S.user ? await S.user.canEdit() : false;
  if (!S.db || !S.uid){ afficherAbsent(); return; }
  S.vue = (S.admin && location.hash !== "#eleve") ? "enseignant" : "eleve";
  S.db.doc("config/classe").onSnapshot(snap => { S.config = {...DEFAUT, ...(snap.exists ? snap.data() : {})}; rendre(); }, erreurDb);
  if (S.admin){
    S.db.collection("traces").onSnapshot(q => { S.traces = Object.fromEntries(q.docs.map(d => [d.id, d.data()])); rendre(); }, erreurDb);
    S.db.doc("notes/classe").onSnapshot(snap => { S.notes = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : {}; rendre(); }, erreurDb);
  }
  S.db.doc("traces/" + S.uid).onSnapshot(snap => { if (!S.monDoc || !snap.metadata.hasPendingWrites) { S.monDoc = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : null; if (!S.local) rendre(); } }, erreurDb);
  claude.use("sample").then(x => { S.sample = x; rendre(); });
  claude.use("downloads").then(x => { S.downloads = x; });
  const sw = $("#switch-view");
  if (S.admin){ sw.hidden = false; sw.onclick = () => { S.vue = S.vue === "enseignant" ? "eleve" : "enseignant"; sw.textContent = S.vue === "enseignant" ? "Voir la vue élève" : "Revenir à la vue enseignant"; rendre(); }; }
  rendre();
}
function erreurDb(e){ console.warn("db", e?.code); }
function afficherAbsent(){
  $("#role-label").textContent = "Accès";
  $("#view").replaceChildren(el("div", {class:"card"},
    el("h2", {}, "Connectez-vous pour participer"),
    el("p", {}, "Cette page enregistre vos productions dans la classe : ouvrez-la connecté à votre compte, avec un accès « Contributeur » donné par votre enseignant.")));
}

function rendre(){
  if (!S.db || !S.uid) return;
  $("#tabs").hidden = S.vue !== "enseignant";
  if (S.vue === "enseignant") vueEnseignant(); else vueEleve();
}

/* =====================================================================
   VUE ÉLÈVE
   ===================================================================== */
let L = null;   // état local de la séance en cours (évite d'écrire à chaque frappe)
function maSeance(){ const n = S.config.seance; return S.monDoc?.seances?.[n] || null; }
function reglagesEleve(){
  const c = S.config, perso = c.eleves?.[S.uid] || {};
  let ordre = perso.ordre || c.ordre, mode = perso.mode || c.mode;
  if (ordre === "adaptatif" && L?.chargeDebut != null){
    const surcharge = echelle(L.chargeDebut) >= c.seuilCharge;
    ordre = surcharge ? "ia" : "reflexion"; if (!perso.mode) mode = surcharge ? "elements" : "questionner";
  }
  return {ordre, mode, retrait: !!perso.retrait};
}
async function sauver(){
  const n = S.config.seance; const doc = S.monDoc ? JSON.parse(JSON.stringify(S.monDoc)) : {seances:{}};
  doc.pseudo = L.pseudo || doc.pseudo || ""; doc.maj = now(); doc.seances = doc.seances || {}; doc.seances[n] = {...L, pseudo: undefined};
  delete doc.seances[n].pseudo;
  S.monDoc = doc;
  try { await S.db.doc("traces/" + S.uid).set(doc); $("#etat-sauv") && ($("#etat-sauv").textContent = "Enregistré"); }
  catch (e) { $("#etat-sauv") && ($("#etat-sauv").textContent = e.code === "invalid_argument" ? "Vous n'avez pas le droit d'écrire : demandez l'accès « Contributeur »." : "Enregistrement impossible pour l'instant, réessayez."); }
}
function vueEleve(){
  $("#role-label").textContent = S.admin ? "Vue élève (aperçu enseignant)" : "Élève";
  const c = S.config, v = $("#view");
  if (!c.ouverte || !c.seance){
    $("#titre").textContent = "En attente de la séance";
    v.replaceChildren(el("div", {class:"card"}, el("p", {}, "Votre enseignant n'a pas encore ouvert de séance. Cette page se mettra à jour toute seule."))); L = null; return;
  }
  $("#titre").textContent = "Séance " + c.seance;
  if (!L || L.num !== c.seance){
    const deja = maSeance();
    L = deja ? JSON.parse(JSON.stringify(deja)) : {num:c.seance, phase:"pseudo", tache:c.tache, debut:null, chargeDebut:null, chargeFin:null, compris:null,
      ideesAvant:[], ideesApres:[], echanges:[], premiereDemande:null, ideesAvantAide:null, bloque:false, ordre:null, mode:null};
    L.pseudo = S.monDoc?.pseudo || "";
    if (L.phase === "pseudo" && L.pseudo) L.phase = "charge";
    S.local = true;
  }
  const r = reglagesEleve();
  const fiche = el("div", {class:"card"}, el("p", {class:"eyebrow"}, "La tâche"), el("p", {}, c.tache || "(consigne non renseignée)"));
  const etat = el("p", {class:"small muted", id:"etat-sauv", "aria-live":"polite"});
  const blocs = [fiche];

  if (L.phase === "pseudo"){
    const inp = el("input", {type:"text", id:"pseudo", maxlength:"24", placeholder:"Par exemple : Panda 7", autocomplete:"off"});
    blocs.push(el("div", {class:"card"}, el("label", {for:"pseudo"}, "Choisissez un pseudonyme"),
      el("p", {class:"small muted"}, "Pas votre vrai nom : l'enseignant vous reconnaîtra par ce pseudonyme."), inp,
      el("button", {class:"primary", onclick: () => { const p = inp.value.trim(); if (!p) return; L.pseudo = p; L.phase = "charge"; vueEleve(); }}, "Continuer")));
  }
  else if (L.phase === "charge"){
    blocs.push(el("div", {class:"card"}, el("h2", {}, "Avant de commencer"),
      echelleUI("Cette tâche me paraît…", ["très facile","facile","moyenne","difficile","très difficile"], L.chargeDebut, x => { L.chargeDebut = x; vueEleve(); }),
      el("button", {class:"primary", disabled: L.chargeDebut == null, onclick: async () => {
        L.debut = now(); const rr = reglagesEleve(); L.ordre = rr.retrait ? "autonomie" : rr.ordre; L.mode = rr.mode;
        L.phase = (L.ordre === "ia") ? "ia" : "reflexion"; if (L.phase === "ia") L.ideesAvantAide = 0;
        await sauver(); vueEleve(); }}, "Commencer")));
  }
  else if (L.phase === "reflexion"){
    const autonome = L.ordre === "autonomie";
    blocs.push(el("div", {class:"card"},
      el("h2", {}, autonome ? "Aujourd'hui, vous travaillez en autonomie" : "D'abord, vos idées"),
      el("p", {class:"small muted"}, autonome ? "Écrivez vos idées, puis terminez la séance." : `Écrivez au moins ${c.minIdees} idée${c.minIdees > 1 ? "s" : ""} avant d'ouvrir l'IA. Si vous êtes vraiment bloqué, dites-le.`),
      listeIdees(L.ideesAvant, "avant"), saisieIdee(t => { L.ideesAvant.push({t: now(), texte:t}); S.focusIdee = true; vueEleve(); sauver(); }),
      el("div", {class:"row"},
        autonome ? el("button", {class:"primary", onclick: async () => { L.phase = "fin"; await sauver(); vueEleve(); }}, "Terminer")
          : el("button", {class:"primary", disabled: L.ideesAvant.length < c.minIdees, onclick: async () => { L.ideesAvantAide = L.ideesAvant.length; L.phase = "ia"; await sauver(); vueEleve(); }}, "Ouvrir l'IA"),
        autonome ? null : el("button", {onclick: async () => { L.bloque = true; L.ideesAvantAide = L.ideesAvant.length; L.phase = "ia"; await sauver(); vueEleve(); }}, "Je suis bloqué"))));
  }
  else if (L.phase === "ia"){
    blocs.push(el("div", {class:"grid2"}, carteIA(r), el("div", {class:"card"},
      el("h2", {}, "Mes idées"),
      L.ideesAvant.length ? el("p", {class:"small muted"}, "Avant l'IA :") : null, listeIdees(L.ideesAvant, "avant"),

let ctlIA = null;
function carteIA(r){
  const zone = el("div", {class:"chat", "aria-live":"polite"}, L.echanges.map(e => el("div", {class:"msg " + (e.role === "ia" ? "ia" : "el")}, e.texte)));
  const ta = el("textarea", {rows:"2", placeholder: r.mode === "questionner" ? "Expliquez votre idée ou votre difficulté" : "Posez votre question", "aria-label":"Message à l'IA"});

  const info = el("p", {class:"small muted"});
  if (!S.sample){ info.textContent = "L'IA n'est pas disponible sur cet appareil. Continuez avec vos idées."; envoyer.disabled = true; }
  envoyer.onclick = async () => {
    const msg = ta.value.trim(); if (!msg || !S.sample) return;
    if (L.premiereDemande == null){ L.premiereDemande = Math.round((Date.now() - Date.parse(L.debut)) / 1000); if (L.ideesAvantAide == null) L.ideesAvantAide = L.ideesAvant.length; }
    L.echanges.push({role:"el", texte: msg.slice(0, 1000), t: now()}); ta.value = "";
    const bulle = el("div", {class:"msg ia"}, "Réflexion…"); zone.append(el("div", {class:"msg el"}, msg), bulle); zone.scrollTop = zone.scrollHeight;
    envoyer.disabled = true; ctlIA = new AbortController();
    try {
      const { text } = await S.sample(promptIA(r), {modelTier:"quick", cache:false, signal: ctlIA.signal, onText: ({text}) => { bulle.textContent = text; zone.scrollTop = zone.scrollHeight; }});
      L.echanges.push({role:"ia", texte: text, t: now()}); await sauver();
      if (!bulle.isConnected) vueEleve();
    } catch (e) {
      bulle.textContent = e.code === "not_granted" || e.code === "sampling_disabled" ? "L'IA n'est pas autorisée ici. Continuez avec vos idées." : e.code === "rate_limited" ? "Trop de demandes : attendez un peu." : "L'IA n'a pas répondu. Réessayez.";
      L.echanges.pop();
    } finally { envoyer.disabled = false; }
  };
  return el("div", {class:"card"}, el("h2", {}, r.mode === "questionner" ? "L'IA vous pose des questions" : "L'IA vous donne un coup de pouce"),
    el("p", {class:"small muted"}, r.mode === "questionner" ? "Elle ne donne pas de réponse : elle vous aide à aller plus loin." : "Elle donne un élément à la fois : à vous de continuer."),
    zone, ta, el("div", {class:"row"}, envoyer), info);
}
function promptIA(r){
  const regles = r.mode === "questionner"
    ? "Tu accompagnes un élève de façon socratique. Tu ne donnes JAMAIS la réponse, ni une liste d'idées, ni un exemple d'idée. Tu poses UNE seule question courte à la fois, qui l'aide à approfondir, justifier, ou explorer une piste différente de celles qu'il a déjà ; ou tu proposes un contre-exemple. Deux phrases au maximum, en français, adaptées à un élève."
    : "Tu aides un élève qui a besoin d'un coup de pouce. Tu donnes UN seul élément de réponse ou un exemple partiel, jamais une liste complète, puis tu poses une courte question pour qu'il continue seul. Trois phrases au maximum, en français, adaptées à un élève.";
  const idees = [...L.ideesAvant, ...L.ideesApres].map(i => "- " + i.texte).join("\n") || "(aucune pour l'instant)";
  const contexte = `${regles}\n\nLa tâche de la classe : ${S.config.tache || "(non précisée)"}\n\nLes idées déjà écrites par l'élève :\n${idees}\n\nRéponds seulement à l'élève, sans préambule.`;
  const tours = [{role:"user", content: contexte}];
  for (const e of L.echanges.slice(-10)) tours.push({role: e.role === "ia" ? "assistant" : "user", content: e.texte});
  if (tours.at(-1).role !== "user") tours.push({role:"user", content:"Continue."});
  return tours;
}

function lignesCSV(){
